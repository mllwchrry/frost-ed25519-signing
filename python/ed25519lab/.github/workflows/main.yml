name: Tests
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v5
      # Pinned: uvx with no version resolves to the latest release, so an
      # unrelated ruff upgrade turns CI red on a day nobody touched the code.
      # Bump deliberately.
      - run: uvx ruff@0.16.3 check .
  mypy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest version of uv, setup Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uvx mypy@2.3.1 .
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install 'pynacl>=1.6.2'
      # Fail rather than skip if the independent oracle is unavailable.
      - run: python3 -m unittest
        env:
          ED25519LAB_REQUIRE_CROSSCHECK: "1"
