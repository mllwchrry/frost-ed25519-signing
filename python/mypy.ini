[mypy]
# Include path to vendored copy of ed25519lab, in order to
# avoid "import-not-found" errors in mypy's `--strict` mode
mypy_path = $MYPY_CONFIG_FILE_DIR/ed25519lab/src
# ed25519lab's vendored `test/` package is not part of the reference
# implementation, so it is excluded here. Its `src/` is left in and
# type-checks cleanly under the fork's mypy.
exclude = ed25519lab/test/