[mypy]
# Include path to vendored copy of ed25519lab, in order to
# avoid "import-not-found" errors in mypy's `--strict` mode
mypy_path = $MYPY_CONFIG_FILE_DIR/ed25519lab/src
# Two spots import optional, test-only dependencies absent from the fork's mypy
# environment: ed25519lab's cross-check test (PyNaCl) and the interop cross-check
# harness under crosscheck/ (solders, PyNaCl). Skip both.
exclude = (ed25519lab/test/test_crosscheck\.py|crosscheck/)
