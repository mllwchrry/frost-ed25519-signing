[mypy]
# Include path to vendored copy of ed25519lab, in order to
# avoid "import-not-found" errors in mypy's `--strict` mode
mypy_path = $MYPY_CONFIG_FILE_DIR/ed25519lab/src
# ed25519lab's cross-check test imports PyNaCl, a test-only dependency absent
# from the fork's mypy environment; skip just that file.
exclude = ed25519lab/test/test_crosscheck\.py
